name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint, Type Check & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Get bun cache directory
        id: bun-cache
        run: echo "CACHE_DIR=$(bun pm cache)" >> "$GITHUB_OUTPUT"

      - name: Setup bun cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.bun-cache.outputs.CACHE_DIR }}
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type checking
        run: bun run typecheck

      - name: Biome lint
        run: bun run lint

      - name: Biome format check
        run: bun run format:check

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Get bun cache directory
        id: bun-cache
        run: echo "CACHE_DIR=$(bun pm cache)" >> "$GITHUB_OUTPUT"

      - name: Setup bun cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.bun-cache.outputs.CACHE_DIR }}
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Get bun cache directory
        id: bun-cache
        run: echo "CACHE_DIR=$(bun pm cache)" >> "$GITHUB_OUTPUT"

      - name: Setup bun cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.bun-cache.outputs.CACHE_DIR }}
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build plugin
        run: bun run build

      - name: Debug build on failure
        if: failure()
        run: |
          echo "::group::Build Directory"
          ls -la dist/
          echo "::endgroup::"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
